# Test the exact native-Metal build artifact (no translation ICDs remain).
name: HD macOS smoke test

permissions:
  contents: read
  actions: read

on:
  workflow_run:
    workflows: ["HD Binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "HD Binaries run ID (blank = newest available macOS artifact)"
        required: false
        type: string

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.package.outputs.run_id }}
      sha: ${{ steps.package.outputs.sha }}
      available: ${{ steps.package.outputs.available }}
    steps:
      - id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN" ]; then
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "supertux-hd-macos-universal" and .expired == false)][0].workflow_run.id // empty')
          fi
          test -n "$RUN"
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" \
            --jq '[.artifacts[] | select(.name == "supertux-hd-macos-universal" and .expired == false)] | length')
          if [ "$COUNT" = 0 ]; then
            echo "No macOS artifact in run $RUN; skipping (e.g. Linux/Windows-only build)." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" >> "$GITHUB_OUTPUT"

  smoke:
    needs: package
    if: needs.package.outputs.available == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Normal runs test the source revision that produced the app.
          # Manual reruns may exercise a fixed test harness against an
          # existing immutable package artifact without rebuilding it.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.package.outputs.sha }}

      - name: Download exact universal macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: supertux-hd-macos-universal
          run-id: ${{ needs.package.outputs.run_id }}
          github-token: ${{ github.token }}
          path: package

      - name: Unpack and relocate (spaces in bundle path)
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha }}
        run: |
          mkdir -p 'relocated app'
          tar -xzf package/supertux-hd-macos-universal.tar.gz -C 'relocated app'
          mv 'relocated app/SuperTux.app' 'relocated app/SuperTux 2 HD.app'
          python3 - <<'PY'
          import json, os, pathlib
          info = json.loads(pathlib.Path('relocated app/SuperTux 2 HD.app/Contents/Resources/HD_BUILD_INFO.json').read_text())
          assert info['commit'] == os.environ['EXPECTED_SHA'], 'Artifact/source commit mismatch'
          PY

      - name: GPU and library diagnostics
        run: |
          system_profiler SPDisplaysDataType SPHardwareDataType
          APP="$PWD/relocated app/SuperTux 2 HD.app"
          ls -la "$APP/Contents/Frameworks/"
          otool -L "$APP/Contents/Resources/bin/supertux2" | head -12
          codesign --verify --verbose "$APP/Contents/Frameworks/libsimplesquirrel.dylib"
          cat "$APP/Contents/Resources/HD_BUILD_INFO.json"

      - name: HD menu, HD clouds, FSR and stock fallback
        run: |
          python3 tools/mac_hd_smoke.py --app 'relocated app/SuperTux 2 HD.app' \
            --output smoke-results

      - name: Upload screenshots, logs and build identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-metal-${{ matrix.os }}
          path: |
            smoke-results/**/run.log
            smoke-results/**/screenshots/*.png
            smoke-results/results.json
            relocated app/SuperTux 2 HD.app/Contents/Resources/HD_BUILD_INFO.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
