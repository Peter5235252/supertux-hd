# Verify the packaged macOS app builds, links and launches (no HD textures).
#
# Headless macOS runners cannot complete Metal frames, so gameplay rendering
# is verified on real hardware (Intel HD 620 Hackintosh) rather than here.
# This job catches packaging/linkage/launch regressions only.
name: macOS package test

permissions:
  contents: read
  actions: read

on:
  workflow_run:
    workflows: ["Game Binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Game Binaries run ID (blank = newest available macOS artifact)"
        required: false
        type: string

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.package.outputs.run_id }}
      sha: ${{ steps.package.outputs.sha }}
      available: ${{ steps.package.outputs.available }}
    steps:
      - id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN" ]; then
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "supertux-hd-macos-universal" and .expired == false)][0].workflow_run.id // empty')
          fi
          test -n "$RUN"
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" \
            --jq '[.artifacts[] | select(.name == "supertux-hd-macos-universal" and .expired == false)] | length')
          if [ "$COUNT" = 0 ]; then
            echo "No macOS artifact in run $RUN; skipping (e.g. Linux/Windows-only build)." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" >> "$GITHUB_OUTPUT"

  smoke:
    needs: package
    if: needs.package.outputs.available == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.package.outputs.sha }}

      - name: Download exact universal macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: supertux-hd-macos-universal
          run-id: ${{ needs.package.outputs.run_id }}
          github-token: ${{ github.token }}
          path: package

      - name: Unpack and relocate (spaces in bundle path)
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha }}
        run: |
          mkdir -p 'relocated app'
          tar -xzf package/supertux-hd-macos-universal.tar.gz -C 'relocated app'
          mv 'relocated app/SuperTux.app' 'relocated app/SuperTux 2.app'
          APP='relocated app/SuperTux 2.app'
          test -x "$APP/Contents/Resources/bin/supertux2"
          # No HD overlay ships any more — stock textures only.
          test ! -e "$APP/Contents/Resources/share/data-hd"
          lipo -info "$APP/Contents/Resources/bin/supertux2" | grep -q x86_64
          lipo -info "$APP/Contents/Resources/bin/supertux2" | grep -q arm64
          codesign --verify --verbose "$APP/Contents/Frameworks/libsimplesquirrel.dylib"

      - name: Launch smoke (`--version`, both arch slices)
        run: |
          APP="$PWD/relocated app/SuperTux 2.app"
          BIN="$APP/Contents/Resources/bin/supertux2"
          SDL_VIDEODRIVER=dummy "$BIN" --version
          # Run the x86_64 slice explicitly too (Intel path).
          arch -x86_64 "$BIN" --version
          grep -a "SDL_GPU" "$BIN" >/dev/null && echo "SDL_GPU backend strings present"
