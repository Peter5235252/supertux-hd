#  SuperTux-HD fork CI: runnable test builds for Linux / Windows / macOS.
#  Triggers on main. Each job produces a portable, startable package:
#  - Linux:   SuperTux-portable/ (cmake --install) + tarball
#  - Windows: SuperTux-portable/ (cmake --install, vcpkg DLLs, VC redist) + zip
#  - macOS:   universal2 (arm64+x86_64) SuperTux.app with bundled Vulkan
#             loader + KosmicKrisp/MoltenVK ICDs + tarball
#  Packages ship as Actions artifacts AND as assets on the rolling
#  `hd-test-build` release. macOS bundles the pinned HD texture release;
#  Linux/Windows currently retain the stock-texture fallback.

name: HD Binaries

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Which OS to build (all, linux, windows, macos)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

env:
  SDK_VERSION: 1.4.363.0

jobs:
  linux:
    if: ${{ inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies (no OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential patchelf \
            libogg-dev libvorbis-dev libopenal-dev \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev \
            libfreetype6-dev libraqm-dev \
            libcurl4-openssl-dev libglm-dev libfmt-dev libphysfs-dev \
            zlib1g-dev

      - name: Configure and build (Release)
        run: |
          mkdir -p build && cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja supertux2

      - name: Install portable tree and verify it starts
        run: |
          cd build
          cmake --install . --prefix SuperTux-portable
          echo "== portable layout =="
          find SuperTux-portable -maxdepth 3 | head -20
          BIN="$(find SuperTux-portable -name supertux2 -type f | head -1)"
          [ -n "$BIN" ] || { echo "supertux2 missing from portable tree"; exit 1; }
          echo "binary: $BIN"
          LIBDIR="$(dirname "$(find SuperTux-portable -name 'libsimplesquirrel.so*' | head -1)")"
          echo "libdir: $LIBDIR"
          # Bundle version-fragile shared libs so the tree also starts on
          # newer distros than the build image (e.g. Arch ships fmt 12,
          # the Ubuntu build needs fmt 10).
          for base in libfmt.so.10 libphysfs.so.1; do
            for f in /usr/lib/x86_64-linux-gnu/${base}* /usr/lib/${base}*; do
              [ -e "$f" ] && cp -L "$f" "$LIBDIR/" && echo "bundled: $f"
            done
          done
          BINDIR="$(dirname "$BIN")"
          REL="$(BINDIR="$BINDIR" LIBDIR="$LIBDIR" python3 -c 'import os; print(os.path.relpath(os.environ["LIBDIR"], os.environ["BINDIR"]))')"
          patchelf --set-rpath "\$ORIGIN/$REL" "$BIN"
          echo "== linked libs =="
          ldd "$BIN" | grep -E "simplesquirrel|libfmt|not found" || true
          if ldd "$BIN" | grep -q "not found"; then
            echo "missing shared libraries:"; ldd "$BIN" | grep "not found"; exit 1
          fi
          echo "== smoke test =="
          SDL_VIDEODRIVER=dummy "$BIN" --version
          tar -czf supertux-hd-linux-portable.tar.gz -C . SuperTux-portable
          ls -lh supertux-hd-linux-portable.tar.gz

      - name: Upload Linux package (artifact)
        # Must not fail the job: the release asset below is the reliable path.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: "supertux-hd-linux-portable"
          path: build/supertux-hd-linux-portable.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true

      - name: Upload Linux package (release asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hd-test-build
          name: "SuperTux-HD test build"
          body: "Rolling runnable test builds from main. Linux portable tarball, Windows portable zip, macOS universal app tarball."
          files: build/supertux-hd-linux-portable.tar.gz
          fail_on_unmatched_files: true
          prerelease: true

  windows:
    if: ${{ inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Use cached dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          # Stable key: vcpkg cache must survive workflow edits. Bump v1->v2
          # manually when the dependency set changes.
          key: hd-vcpkg-win-x64-v1
          restore-keys: |
            hd-vcpkg-win-x64-

      - name: Install dependencies (no glew)
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Fail fast: without this, a failed vcpkg install is silently
          # ignored and the build breaks later with missing headers.
          $ErrorActionPreference = 'Stop'
          cd C:/
          vcpkg integrate install
          $pkgs = @(
            'curl:x64-windows', 'libogg:x64-windows', 'libvorbis:x64-windows',
            'openal-soft:x64-windows', 'sdl3:x64-windows',
            'sdl3-image[jpeg,png]:x64-windows', 'sdl3-ttf[harfbuzz]:x64-windows',
            'glm:x64-windows', 'zlib:x64-windows', 'fmt:x64-windows',
            'physfs:x64-windows', 'libraqm:x64-windows', 'freetype:x64-windows'
          )
          foreach ($p in $pkgs) {
            $done = $false
            for ($i = 1; $i -le 3 -and -not $done; $i++) {
              try {
                if ($p -eq 'freetype:x64-windows') { vcpkg install --recurse $p }
                else { vcpkg install $p }
                $done = $true
              } catch {
                Write-Output "attempt $i failed for $p, retrying in 20s"
                Start-Sleep 20
                if ($i -eq 3) { throw }
              }
            }
          }

      - name: Configure and build (Release, x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir build -Force
          cd build
          cmake .. -G "Visual Studio 18 2026" -A x64 `
                   -DCMAKE_BUILD_TYPE=Release `
                   -DENABLE_DISCORD=ON -DVCPKG_MANIFEST_MODE=OFF `
                   -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
                   -DVCPKG_TARGET_TRIPLET="x64-windows" `
                   -DPACKAGE_VCREDIST=true `
                   -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
          cmake --build . --config Release --target supertux2

      - name: Install portable tree and verify contents
        shell: pwsh
        run: |
          cd build
          cmake --install . --config Release --prefix SuperTux-portable
          Get-ChildItem SuperTux-portable | Select-Object Name
          $exe = (Get-ChildItem -Recurse -Filter supertux2.exe SuperTux-portable | Select-Object -First 1).FullName
          if (-not $exe) { throw "supertux2.exe missing from portable tree" }
          Write-Output "exe: $exe"
          $dlls = Get-ChildItem -Recurse -Filter *.dll SuperTux-portable
          Write-Output "bundled DLLs: $($dlls.Count)"
          $dlls | Select-Object -First 20 Name
          foreach ($need in @("SDL3.dll", "SDL3_image.dll", "SDL3_ttf.dll")) {
            if (-not (Get-ChildItem -Recurse -Filter $need SuperTux-portable)) { throw "missing $need" }
          }
          Compress-Archive -Path SuperTux-portable -DestinationPath supertux-hd-windows-portable.zip -Force
          Get-ChildItem supertux-hd-windows-portable.zip | Select-Object Name, Length

      - name: Upload Windows package (artifact)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: "supertux-hd-windows-portable"
          path: build/supertux-hd-windows-portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true

      - name: Upload Windows package (release asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hd-test-build
          name: "SuperTux-HD test build"
          body: "Rolling runnable test builds from main. Linux portable tarball, Windows portable zip, macOS universal app tarball."
          files: build/supertux-hd-windows-portable.zip
          fail_on_unmatched_files: true
          prerelease: true

  macos:
    if: ${{ inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos' }}
    runs-on: macos-15
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download pinned HD texture set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(python3 -c 'import json; print(json.load(open("mk/hd-assets.json"))["release"])')
          ASSET=$(python3 -c 'import json; print(json.load(open("mk/hd-assets.json"))["asset"])')
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir hd-assets
          python3 - <<'PY'
          import hashlib, json, pathlib
          pin = json.loads(pathlib.Path('mk/hd-assets.json').read_text())
          with (pathlib.Path('hd-assets') / pin['asset']).open('rb') as f:
              assert hashlib.file_digest(f, 'sha256').hexdigest() == pin['sha256'], 'HD archive checksum mismatch'
          PY

      - name: Test HD archive validation
        run: python3 -m unittest discover -s tests/tools -v

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          # Stable key covering both triplets; bump manually on dep changes.
          key: hd-vcpkg-mac-v2-vulkan
          restore-keys: |
            hd-vcpkg-mac-

      - name: Install dependencies (no glew, both archs)
        env:
          VCPKG_TRIPLET: arm64-osx
        run: |
          brew install ninja 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-binary-cache"
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          cd "$VCPKG_ROOT"
          ./bootstrap-vcpkg.sh
          for TRIPLET in arm64-osx x64-osx; do
            # vulkan port provides headers so sdl3[vulkan] compiles the
            # Vulkan GPU backend in (without it SDL reports
            # "vulkan unsupported!" at CreateGPUDevice time).
            ./vcpkg install --classic --triplet=$TRIPLET \
              fmt libogg libvorbis libraqm freetype physfs glm libpng zlib \
              vulkan "sdl3[vulkan]" "sdl3-image[jpeg,png]" sdl3-ttf curl openal-soft
          done

      - name: Save vcpkg binaries
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build arm64 and x86_64
        run: |
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then TRIPLET=arm64-osx; else TRIPLET=x64-osx; fi
            mkdir -p build-$ARCH && cd build-$ARCH
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
              -DVCPKG_TARGET_TRIPLET=$TRIPLET \
              -DVCPKG_MANIFEST_MODE=OFF \
              -DCMAKE_OSX_ARCHITECTURES=$ARCH
            ninja supertux2
            ls -lh supertux2
            cd ..
          done

      - name: Assemble universal2 SuperTux.app
        run: |
          cd build-arm64
          cpack -G Bundle
          STAGED="$(find _CPack_Packages/Darwin/Bundle -maxdepth 2 -name 'SuperTux.app' -type d | head -1)"
          if [ -z "$STAGED" ]; then
            echo "cpack did not stage SuperTux.app"; find _CPack_Packages -maxdepth 3 | head; exit 1
          fi
          rm -rf SuperTux.app && cp -R "$STAGED" SuperTux.app
          APP="$PWD/SuperTux.app"
          BIN="$(find "$APP" -name supertux2 -type f | head -1)"
          [ -n "$BIN" ] || { echo "supertux2 missing in bundle"; exit 1; }
          echo "bundle binary: $BIN"
          lipo -create supertux2 ../build-x86_64/supertux2 -output "$BIN"
          # Use the freshly built libs by explicit path: a bare find can
          # return the already-staged bundle copy first (readdir order),
          # which breaks the merge with a same-architectures lipo error.
          A64_DYLIB="$(find ../build-arm64/external -name 'libsimplesquirrel.dylib' | head -1)"
          X64_DYLIB="$(find ../build-x86_64/external -name 'libsimplesquirrel.dylib' | head -1)"
          [ -n "$A64_DYLIB" ] && [ -n "$X64_DYLIB" ] || { echo "error: libsimplesquirrel.dylib missing in build dirs"; exit 1; }
          echo "== input archs =="; lipo -info "$A64_DYLIB" "$X64_DYLIB"
          # Frameworks/ is only created later by the Vulkan bundling step.
          mkdir -p "$APP/Contents/Frameworks"
          if [ -n "$A64_DYLIB" ] && [ -n "$X64_DYLIB" ]; then
            find "$APP" -name 'libsimplesquirrel.dylib' | while read -r d; do
              lipo -create "$A64_DYLIB" "$X64_DYLIB" -output "$d"
            done
            # Direct-binary launches (CI smoke, Terminal) bypass the
            # Contents/MacOS/SuperTux launcher script and its
            # DYLD_FALLBACK_LIBRARY_PATH, so the lib must also resolve
            # via @rpath: stage a universal copy in Frameworks and add
            # the matching LC_RPATHs to the binary.
            lipo -create "$A64_DYLIB" "$X64_DYLIB" -output "$APP/Contents/Frameworks/libsimplesquirrel.dylib"
            install_name_tool -id "@rpath/libsimplesquirrel.dylib" "$APP/Contents/Frameworks/libsimplesquirrel.dylib" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/../../Frameworks" "$BIN" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/../MacOS" "$BIN" 2>/dev/null || true
          fi
          echo "== rpaths =="; otool -l "$BIN" | grep -A2 LC_RPATH || true
          echo "== linked =="; otool -L "$BIN" | head -20
          # Fail fast if SDL was built without the Vulkan GPU backend.
          strings "$BIN" | grep -q "vkCreateInstance" || { echo "error: SDL lacks Vulkan backend (vkCreateInstance missing)"; exit 1; }
          codesign --force --sign - "$APP/Contents/Frameworks/libsimplesquirrel.dylib" "$BIN" 2>/dev/null || true
          lipo -info "$BIN"
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BIN_IN_APP=$BIN" >> $GITHUB_ENV

      - name: Cache Vulkan SDK zip
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vksdk-zip
          key: hd-vulkansdk-${{ env.SDK_VERSION }}

      - name: Download Vulkan SDK zip (cache miss only)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/vksdk-zip"
          curl -fL -o "${{ github.workspace }}/vksdk-zip/vulkansdk-macos-${SDK_VERSION}.zip" \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkansdk-macos-${SDK_VERSION}.zip"
          ls -lh "${{ github.workspace }}/vksdk-zip/"

      - name: Bundle Vulkan loader + KosmicKrisp/MoltenVK ICDs
        run: |
          APP="${{ env.APP }}" \
          SDK_ZIP="${{ github.workspace }}/vksdk-zip/vulkansdk-macos-${SDK_VERSION}.zip" \
          SDK_VERSION="${SDK_VERSION}" \
          bash mk/macos-bundle-vulkan.sh

      - name: Install and verify bundled HD overlay
        run: |
          DATA="${{ env.APP }}/Contents/Resources/share/supertux2"
          test -f "$DATA/credits.stxt"
          ASSET=$(python3 -c 'import json; print(json.load(open("mk/hd-assets.json"))["asset"])')
          python3 tools/hd_assets.py install --archive "hd-assets/$ASSET" \
            --pin mk/hd-assets.json --data-dir "$DATA"
          python3 - <<'PY'
          import json, os, pathlib
          pin = json.loads(pathlib.Path('mk/hd-assets.json').read_text())
          info = {'commit': os.environ['GITHUB_SHA'], 'hd_assets': pin}
          (pathlib.Path(os.environ['APP']) / 'Contents/Resources/HD_BUILD_INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          PY

      - name: Diagnose staged ICD libraries
        run: |
          APP="${{ env.APP }}"
          echo "== MoltenVK =="; lipo -info "$APP/Contents/Frameworks/libMoltenVK.dylib"
          otool -L "$APP/Contents/Frameworks/libMoltenVK.dylib" | head -12
          codesign --verify --verbose "$APP/Contents/Frameworks/libMoltenVK.dylib"
          KK_BIN="$(find "$APP/Contents/Frameworks/KosmicKrisp.framework" -type f -name KosmicKrisp | head -1)"
          if [ -n "$KK_BIN" ]; then
            echo "== KosmicKrisp ($KK_BIN) =="; lipo -info "$KK_BIN"
            otool -L "$KK_BIN" | head -15
            codesign --verify --verbose "$KK_BIN"
          else
            echo "KosmicKrisp binary missing from framework"
          fi

      - name: Smoke test and package
        run: |
          SDL_VIDEODRIVER=dummy "${{ env.BIN_IN_APP }}" --version
          cd "$(dirname "${{ env.APP }}")"
          tar -czf supertux-hd-macos-universal.tar.gz SuperTux.app
          ls -lh supertux-hd-macos-universal.tar.gz
          echo "PKG=$PWD/supertux-hd-macos-universal.tar.gz" >> $GITHUB_ENV

      - name: Upload macOS package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: "supertux-hd-macos-universal"
          path: ${{ env.PKG }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload macOS package (release asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hd-test-build
          name: "SuperTux-HD test build"
          body: "Rolling runnable test builds from main. macOS universal app includes the pinned HD texture set; Linux/Windows portable packages currently use stock textures. MoltenVK is the macOS default; KosmicKrisp is opt-in pending GPU validation."
          files: ${{ env.PKG }}
          fail_on_unmatched_files: true
          prerelease: true
